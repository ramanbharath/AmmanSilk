# ── render.yaml ─────────────────────────────────────────────
# One-click deploy to Render.com
# Hosts: Angular (static) + Express API + PostgreSQL — all free tier
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────

services:
  # ── Full-Stack Web Service (API + serves Angular dist) ──────
  - type: web
    name: ammansilks-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm ci && ./node_modules/.bin/ng build --configuration=production && cd backend && npm ci --omit=dev
    startCommand: node backend/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ammansilks-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: ammansilks-db
    databaseName: ammansilks_db
    user: ammansilks
    plan: free
    region: singapore
